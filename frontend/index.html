<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Hisob ERP — Festival Collection & Financial Management System for Ganapati Mandals, Temples, Trusts and NGOs." />
    <meta name="theme-color" content="#0B2347" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hisob" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preconnect to Google Fonts for faster receipt font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload receipt fonts (Mukta for Marathi/Hindi, Yatra One for decorative headers) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Yatra+One&display=swap" />
    <link rel="apple-touch-icon" href="/hisobapp.png" />
    <!-- Open Graph / WhatsApp Social Sharing Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hisob ERP — Official Donation & Festival Portal" />
    <meta property="og:description" content="Verify official donation receipts online, check live festival Aarti schedules, & send digital contributions." />
    <meta property="og:image" content="https://hisob.in/hisobapp.png" />
    <meta property="og:image:secure_url" content="https://hisob.in/hisobapp.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="Hisob ERP" />

    <title>Hisob ERP — Festival Financial & Schedule Portal</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
