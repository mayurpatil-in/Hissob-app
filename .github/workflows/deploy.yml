name: CI/CD Deployment to WebHostMost

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build & Deploy Frontend (React/Vite) to public_html
  # ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.hisob.in/api/v1' }}
          VITE_APP_TITLE: "Hisob ERP"
        run: |
          cd frontend
          npm run build

      - name: Deploy Frontend to WebHostMost via SFTP
        uses: SamKirsch/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          port: ${{ secrets.SFTP_PORT || 22 }}
          local-dir: ./frontend/dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Deploy Backend & Trigger Alembic Migrations + Passenger Restart
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend & Restart App
    needs: deploy-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Backend Files to WebHostMost via SFTP
        uses: SamKirsch/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          port: ${{ secrets.SFTP_PORT || 22 }}
          local-dir: ./backend/
          server-dir: ./hissob_backend/backend/
          exclude: |
            **/.venv/**
            **/uploads/**
            **/.env
            **/__pycache__/**

      - name: Deploy passenger_wsgi.py & alembic.ini via SFTP
        uses: SamKirsch/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          port: ${{ secrets.SFTP_PORT || 22 }}
          local-dir: ./
          server-dir: ./hissob_backend/
          exclude: |
            **/*
            !passenger_wsgi.py
            !alembic.ini

      - name: Run Remote SSH Commands (Dependencies, Migrations & Passenger Restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Activating virtualenv and upgrading Python packages..."
            source /home/${{ secrets.CPANEL_USER }}/virtualenv/hissob_backend/3.12/bin/activate
            cd /home/${{ secrets.CPANEL_USER }}/hissob_backend
            pip install --upgrade pip
            pip install -r backend/requirements.txt

            echo "Running database migrations..."
            cd backend
            alembic upgrade head

            echo "Triggering Phusion Passenger restart..."
            cd /home/${{ secrets.CPANEL_USER }}/hissob_backend
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deployment completed successfully!"
