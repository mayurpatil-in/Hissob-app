name: CI/CD Deployment to WebHostMost

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Deploy Backend & Trigger Alembic Migrations + Passenger Restart
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend & Restart App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Backend Files to WebHostMost via SCP/SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST || 'server3.webhostmost.com' }}
          username: ${{ secrets.SSH_USER || 'qhmwlequ' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 2323 }}
          source: "backend/*,passenger_wsgi.py,alembic.ini"
          target: "/home/qhmwlequ/domains/api.hisob.in/Hissob-app/backend/"
          strip_components: 1

      - name: Run Remote SSH Commands (Dependencies, Migrations & Passenger Restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || 'server3.webhostmost.com' }}
          username: ${{ secrets.SSH_USER || 'qhmwlequ' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 2323 }}
          script: |
            echo "Activating virtualenv and upgrading Python packages..."
            source /home/qhmwlequ/virtualenv/domains/api.hisob.in/Hissob-app/backend/3.12/bin/activate
            cd /home/qhmwlequ/domains/api.hisob.in/Hissob-app/backend
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "Cleaning up redundant nested backend folder if present..."
            rm -rf backend

            echo "Running database migrations..."
            alembic upgrade head

            echo "Triggering Phusion Passenger restart..."
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Backend deployment completed successfully!"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build & Deploy Frontend (React/Vite) to public_html
  # ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build & Compress Frontend Production Bundle
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.hisob.in/api/v1' }}
          VITE_APP_TITLE: "Hisob ERP"
        run: |
          cd frontend
          npm run build
          cd dist
          tar -czf ../../frontend.tar.gz .

      - name: Fast Upload Frontend Archive via SCP/SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST || 'server3.webhostmost.com' }}
          username: ${{ secrets.SSH_USER || 'qhmwlequ' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 2323 }}
          source: "frontend.tar.gz"
          target: "/home/qhmwlequ/domains/hisob.in/public_html/"

      - name: Extract Frontend Build & Cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || 'server3.webhostmost.com' }}
          username: ${{ secrets.SSH_USER || 'qhmwlequ' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 2323 }}
          script: |
            echo "Extracting frontend static assets directly in public_html..."
            cd /home/qhmwlequ/domains/hisob.in/public_html
            tar -xzf frontend.tar.gz
            rm -f frontend.tar.gz
            echo "Frontend deployment completed in seconds!"
