name: CI — Quality Gates

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: ['**']     # Run CI on ALL branches
  pull_request:
    branches: [main, develop]
  workflow_dispatch:     # Allow manual trigger from GitHub UI

# Cancel in-flight runs for the same branch/PR to save runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Backend — Lint + Type-check + Unit/Integration Tests
  # ───────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: 🐍 Backend CI (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hisob_test
          POSTGRES_PASSWORD: hisob_test_secret
          POSTGRES_DB: hisob_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hisob_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://hisob_test:hisob_test_secret@localhost:5432/hisob_test_db
      SECRET_KEY: ci-test-secret-key-32-chars-minimum
      ENVIRONMENT: testing
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Ruff Lint Check
        run: ruff check app/ --output-format=github
        continue-on-error: false

      - name: Ruff Format Check
        run: ruff format app/ --check
        continue-on-error: true

      - name: Run Tests with Coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=30 \
            -v \
            --tb=short \
            -x
        env:
          DATABASE_URL: postgresql://hisob_test:hisob_test_secret@localhost:5432/hisob_test_db

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend — Lint + TypeScript Check + Build Validation
  # ───────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: OxLint Check
        run: npm run lint

      - name: TypeScript Type-Check
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Production Build Validation
        env:
          VITE_API_BASE_URL: https://api.hisob.in/api/v1
          VITE_APP_TITLE: "Hisob ERP"
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1
