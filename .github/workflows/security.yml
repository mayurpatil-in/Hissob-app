name: Security — Dependency Audit & Secret Scan

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  schedule:
    # Run every Monday at 06:00 IST (00:30 UTC)
    - cron: "30 0 * * 1"
  workflow_dispatch:

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Python Dependency Vulnerability Scan (pip-audit / Safety)
  # ───────────────────────────────────────────────────────────────────────────
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit Vulnerability Scan
        run: |
          pip-audit -r requirements.txt \
            --format=json \
            --output=pip-audit-results.json || true
          pip-audit -r requirements.txt || true

      - name: Upload pip-audit Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: backend/pip-audit-results.json
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: npm Dependency Audit (frontend)
  # ───────────────────────────────────────────────────────────────────────────
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm Audit (High/Critical Only)
        run: npm audit --audit-level=high || true

      - name: npm Outdated Check
        run: npm outdated || true

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Secret / Credential Leak Detection (Gitleaks)
  # ───────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Leak Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for thorough scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true  # Report but don't block

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: CodeQL Static Analysis (Python + JavaScript)
  # ───────────────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
